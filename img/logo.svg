  <rect x="5" y="12" width="7" height="1.6" fill="#4b2a7b" fill-opacity="0.45"/>
  <rect x="5" y="28.5" width="7" height="1.6" fill="#4b2a7b" fill-opacity="0.45"/>
  <rect x="13.5" y="13" width="7" height="20" rx="1.5" fill="#f9d4e2"/>
  <rect x="13.5" y="16" width="7" height="1.6" fill="#9c2f5a" fill-opacity="0.45"/>
  <rect x="13.5" y="28.5" width="7" height="1.6" fill="#9c2f5a" fill-opacity="0.45"/>
  <g transform="rotate(-20 36 33)">
    <rect x="29" y="11" width="7" height="22" rx="1.5" fill="#f6e6b8"/>
    <rect x="29" y="14" width="7" height="1.6" fill="#2f4858" fill-opacity="0.45"/>
